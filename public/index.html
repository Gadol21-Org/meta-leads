<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meta Leads</title>
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Leads">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="bar">
    <a href="/" class="brand" data-link>Meta Leads</a>
    <div class="bar-actions">
      <button id="notify-btn" class="chip" hidden>Enable notifications</button>
      <button id="menu-btn" class="icon-btn" aria-label="Menu" hidden>⋯</button>
    </div>
  </header>

  <div id="menu" class="menu" hidden>
    <button data-action="sync">Import existing leads from Meta</button>
    <button data-action="test-push">Send test notification</button>
    <button data-action="unsubscribe">Turn off notifications on this device</button>
    <button data-action="logout">Log out</button>
  </div>

  <main id="view" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
