<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Meta Leads</title>
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icons/logo-192.png">
  <link rel="apple-touch-icon" href="/icons/logo-apple-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Leads">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header class="bar">
    <a href="/" class="brand" data-link>Meta Leads</a>
    <div class="bar-actions">
      <a href="/stats" data-link class="chip">סטטיסטיקה</a>
      <button id="notify-btn" class="chip" hidden>הפעלת התראות</button>
      <button id="menu-btn" class="icon-btn" aria-label="תפריט" hidden>⋯</button>
    </div>
  </header>

  <div id="menu" class="menu" hidden>
    <button data-action="test-push">שליחת התראת בדיקה</button>
    <button data-action="unsubscribe">כיבוי התראות במכשיר הזה</button>
  </div>

  <main id="view" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
