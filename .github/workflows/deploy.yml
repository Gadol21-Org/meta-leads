# On every push to main: build the Docker image, push it to GitHub's container
# registry, and replace the running app on the Oracle Cloud VM over SSH.
# Pull requests only build the image. The deploy step is skipped until the
# ORACLE_HOST variable is set; see deploy/README.md for the one-time setup.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A native arm64 runner for the arm64 VM. For an AMD VM set the
    # BUILD_RUNNER variable to ubuntu-24.04.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.ORACLE_HOST != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ vars.ORACLE_USER || 'ubuntu' }}@${{ vars.ORACLE_HOST }}
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ vars.ORACLE_HOST }}" > ~/.ssh/known_hosts
          fi
      - name: Write the app's .env on the VM
        env:
          LEADS_ENV: ${{ secrets.LEADS_ENV }}
        run: |
          if [ -z "$LEADS_ENV" ]; then echo "::error::the LEADS_ENV secret is not set"; exit 1; fi
          for n in META_APP_SECRET META_VERIFY_TOKEN VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            if ! printf '%s\n' "$LEADS_ENV" | grep -q "^$n=."; then
              echo "::error::LEADS_ENV has no $n= line"; exit 1
            fi
          done
          # The file goes over ssh's stdin, never onto a command line.
          printf '%s\n' "$LEADS_ENV" \
            | ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$TARGET" \
                'umask 077 && mkdir -p ~/meta-leads && cat > ~/meta-leads/.env.new && mv ~/meta-leads/.env.new ~/meta-leads/.env'
      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes $TARGET"
          # The image is private: log the VM in for the pull with this job's
          # short-lived token, and log it out afterwards.
          printf '%s' "$TOKEN" | $ssh docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          status=0
          $ssh bash -s -- "$IMAGE:${{ github.sha }}" < deploy/deploy.sh || status=$?
          $ssh docker logout ghcr.io
          exit $status
